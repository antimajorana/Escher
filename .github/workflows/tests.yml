name: tests

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,fast,widgets]"
      - name: Run the default tests (slow ones excluded)
        run: python -m pytest -q

  oldest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.*" "scipy==1.10.*" "networkx==3.0.*" "matplotlib==3.7.*" "spglib==2.5.*" "pytest>=7.0"
          python -m pip install --no-deps -e .
          python -c "import numpy, scipy, networkx, matplotlib, spglib; print(numpy.__version__, scipy.__version__, networkx.__version__, matplotlib.__version__, spglib.__version__)"
      - name: Run the default tests on oldest floor versions
        run: python -m pytest -q

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: rust
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust workspace tests
        working-directory: rust
        run: cargo test --release --workspace
      - name: Build papertilling-rs wheel
        run: |
          python -m pip install --upgrade pip "maturin>=1.16"
          python -m maturin build --release --manifest-path rust/papertilling-py/Cargo.toml --out rust/wheels
      - name: Install Python package and built wheel
        run: |
          python -m pip install ".[test,fast,widgets]"
          python -m pip install --no-index --find-links rust/wheels papertilling-rs
      - name: Run Python tests with papertilling-rs active
        run: |
          python -c "import papertilling_rs; print(papertilling_rs.version())"
          python -m pytest -q
      - name: Run Python tests with PAPERTILLING_NO_RUST=1
        env:
          PAPERTILLING_NO_RUST: "1"
        run: python -m pytest -q
