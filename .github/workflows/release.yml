name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version label (used for artifact filenames on manual runs)"
        required: false
        default: "0.2.0"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows x86_64 Setup & Wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - &source-notice
        name: Record the source revision for this build
        shell: bash
        run: |
          printf '\nExact source revision: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> rust/papertilling-py/SOURCE-NOTICE.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-win
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $raw = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($raw)) { $raw = "0.2.0" }
          "version=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build Escher (release)
        run: cargo build --release --manifest-path rust/Cargo.toml -p papertilling-app
      - name: Build Windows Setup.exe (Inno Setup 6) and portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "rust\papertilling-app\installer\windows\papertilling.iss"
          $portDir = "dist\escher-$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $portDir | Out-Null
          Copy-Item "rust\target\release\papertilling-app.exe" "$portDir\Escher.exe"
          Copy-Item LICENSE, rust/papertilling-py/SOURCE-NOTICE.txt -Destination $portDir
          Compress-Archive -Path "$portDir\*" -DestinationPath "dist\escher-$ver-windows-x86_64-portable.zip" -Force
          Remove-Item -Recurse -Force $portDir
      - name: Build Python acceleration wheel (abi3-py310)
        run: |
          python -m pip install --upgrade pip "maturin>=1.16"
          python -m maturin build --release --manifest-path rust/papertilling-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.whl

  macos-dmg:
    name: macOS Universal .dmg & Wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - *source-notice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-mac
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.tag }}"
          fi
          echo "version=${VER:-0.2.0}" >> "$GITHUB_OUTPUT"
      - name: Build Universal macOS binary and .dmg
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cargo build --release --manifest-path rust/Cargo.toml -p papertilling-app --target aarch64-apple-darwin
          cargo build --release --manifest-path rust/Cargo.toml -p papertilling-app --target x86_64-apple-darwin

          APP="stage_dmg/Escher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          lipo -create \
            rust/target/aarch64-apple-darwin/release/papertilling-app \
            rust/target/x86_64-apple-darwin/release/papertilling-app \
            -output "$APP/Contents/MacOS/Escher"
          chmod +x "$APP/Contents/MacOS/Escher"

          sed "s/0\.2\.0/$VER/g" rust/papertilling-app/installer/macos/Info.plist > "$APP/Contents/Info.plist"

          ICONSET="icon.iconset"
          mkdir -p "$ICONSET"
          SRC="assets/escher.png"
          for sz in 16 32 128 256; do
            sips -z $sz $sz "$SRC" --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
          done
          cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png"
          cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
          sips -z 64 64 "$SRC" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/icon.icns"

          ln -s /Applications stage_dmg/Applications
          cp LICENSE rust/papertilling-py/SOURCE-NOTICE.txt "$APP/Contents/Resources/"
          cp LICENSE stage_dmg/LICENSE.txt
          cp rust/papertilling-py/SOURCE-NOTICE.txt stage_dmg/
          hdiutil create -volname "Escher $VER" -srcfolder stage_dmg -ov -format UDZO "dist/escher-$VER-macos-universal.dmg"
      - name: Build Universal2 Python acceleration wheel
        run: |
          python -m pip install --upgrade pip "maturin>=1.16"
          python -m maturin build --release --target universal2-apple-darwin --manifest-path rust/papertilling-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/*.dmg
            dist/*.whl

  linux-bundle:
    name: Linux x86_64 Bundle & Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - *source-notice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-linux
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.tag }}"
          fi
          echo "version=${VER:-0.2.0}" >> "$GITHUB_OUTPUT"
      - name: Build Linux desktop bundle (.tar.gz with desktop installer)
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cargo build --release --manifest-path rust/Cargo.toml -p papertilling-app
          STAGE="escher-$VER-linux-x86_64"
          mkdir -p "$STAGE" dist
          cp rust/target/release/papertilling-app "$STAGE/escher"
          chmod +x "$STAGE/escher"
          cp assets/escher.png "$STAGE/icon.png"
          cp rust/papertilling-app/installer/linux/papertilling.desktop "$STAGE/escher.desktop"
          cp rust/papertilling-app/installer/linux/install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          cp LICENSE rust/papertilling-py/SOURCE-NOTICE.txt "$STAGE/"
          tar -czf "dist/$STAGE.tar.gz" "$STAGE"
      - name: Build manylinux Python acceleration wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --manifest-path rust/papertilling-py/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.whl

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, macos-dmg, linux-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          name: Escher ${{ github.ref_name }}
          body: |
            ### Desktop App Installers (no Rust or Python needed)
            - **Windows (x86_64):** download and run `escher-*-windows-x86_64-setup.exe` (per-user installer with Start Menu & Desktop shortcuts; no Administrator prompt required), or unpack `*-portable.zip`.
            - **macOS (Apple Silicon & Intel):** open `escher-*-macos-universal.dmg` and drag **Escher.app** to **Applications**.
            - **Linux (x86_64):** unpack `escher-*-linux-x86_64.tar.gz` and run `./install.sh` (installs to `~/.local` with desktop launcher icon).

            **Corresponding source:** [Browse the source used for these downloads](https://github.com/${{ github.repository }}/tree/${{ github.sha }}). The same revision is in each package’s `SOURCE-NOTICE.txt`.

            ### Optional Python Acceleration
            Choose the wheel for your operating system and install it with pip alongside the Python package from this repository. The wheels support Python 3.10 and later.
