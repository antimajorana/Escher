[package]
name = "papertilling-core"
description = "Core tiling, Delaney-Dress symbol, surface, and defect library for papertilling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
svg = "0.18.0"
